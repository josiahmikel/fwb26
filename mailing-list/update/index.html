            33% { border-color: #ffdd00; }
            50% { border-color: #00ff44; }
            66% { border-color: #00ddff; }

            33% { color: #ffdd00; }
            50% { color: #00ff44; }
            66% { color: #00ddff; }
            83% { color: #cc00ff; }
            100% { color: #ff0040; }

            33% { border-color: rgba(255, 221, 0, 0.5); }
