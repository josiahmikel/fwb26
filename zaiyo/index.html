    <audio id="audio"></audio>

    <script>
        const tracks = [
            { src: '/assets/audio/BETTER-THAN-I-EVER-WAS.mp3', title: 'BETTER THAN I EVER WAS' },
            { src: '/assets/audio/MILYE.mp3', title: 'MILYE' }
        ];

        let currentTrack = 0;
        let isPlaying = false;

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        function loadTrack(index) {
            currentTrack = index;
            audio.src = tracks[index].src;
            progressFill.style.width = '0%';
        }

        function playTrack() {
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause" aria-hidden="true"></i>';
                playBtn.setAttribute('aria-label', 'Pause');
            }).catch(err => console.log('Play failed:', err));
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play" aria-hidden="true"></i>';
            playBtn.setAttribute('aria-label', 'Play');
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseTrack();
            else playTrack();
        });

        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % tracks.length;
            loadTrack(currentTrack);
            if (isPlaying) playTrack();
        });

        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';
            progressBar.setAttribute('aria-valuenow', Math.round(pct));
        });

        audio.addEventListener('ended', () => {
            currentTrack = (currentTrack + 1) % tracks.length;
            loadTrack(currentTrack);
            playTrack();
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        });

        loadTrack(0);
    </script>
