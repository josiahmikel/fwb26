<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friends With Bears Records</title>
    <meta name="description" content="Friends With Bears Records – home to creaturethief, April Fridae, eliesriot, and Zayok. Explore our latest releases.">
    <meta name="keywords" content="Friends With Bears Records, creaturethief, April Fridae, eliesriot, Zayok, indie music, electronic, hyperpop, record label">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://friendswithbears.com">
    <meta property="og:title" content="Friends With Bears Records">
    <meta property="og:description" content="Friends With Bears Records – home to creaturethief, April Fridae, eliesriot, and Zayok.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://friendswithbears.com">
    <meta property="og:image" content="https://friendswithbears.com/assets/fridae-cover.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Friends With Bears Records">
    <meta name="twitter:description" content="Friends With Bears Records – home to creaturethief, April Fridae, eliesriot, and Zayok.">
    <meta name="twitter:image" content="https://friendswithbears.com/assets/fridae-cover.jpg">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "MusicGroup",
            "name": "Friends With Bears Records",
            "description": "Independent record label featuring creaturethief, April Fridae, eliesriot, and Zayok.",
            "url": "https://friendswithbears.com",
            "genre": ["Electronic", "Indie", "Hyperpop", "Alternative"],
            "foundingDate": "2023",
            "member": [
                { "@type": "MusicGroup", "name": "creaturethief" },
                { "@type": "MusicGroup", "name": "April Fridae" },
                { "@type": "MusicGroup", "name": "eliesriot" },
                { "@type": "MusicGroup", "name": "Zayok" }
            ]
        }
    </script>

    <style>
        /* --- RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
        }

        /* --- CONTAINER --- */
        .wheel-container {
            width: 100vw;
            /* FIX: Use 100dvh on modern mobile, fallback to 100vh */
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            overflow: hidden;
            padding: 20px 0;
            /* FIX: Add safe-area padding for mobile notches/toolbars */
            padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
        }

        /* --- HEADER (top) --- */
        .header-section {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 94%;
            max-width: 1800px;
            padding: 0 0.2rem;
        }
        .title-image {
            display: block;
            width: auto;
            height: auto;
        }
        .arrow-image {
            display: block;
            width: auto;
            cursor: pointer;
            transition: opacity 0.2s ease;
            opacity: 1;
        }
        .arrow-image:hover { opacity: 0.6; }
        .arrow-image:active { opacity: 0.8; }

        /* --- WHEEL (pushed to bottom) --- */
        .scroll-wrapper {
            flex: 0 0 auto;
            width: 94%;
            max-width: 1800px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overscroll-behavior: none;
            touch-action: pan-x;
            padding: 0.5rem 0.2rem;
            display: flex;
            align-items: center;
        }
        .scroll-wrapper::-webkit-scrollbar { display: none; }

        .wheel-track {
            display: flex;
            flex-wrap: nowrap;
            gap: 0;
            padding: 0;
            width: fit-content;
            height: 100%;
            align-items: center;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* --- COVERS --- */
        .album-square {
            flex: 0 0 auto;
            position: relative;
            border: none;
            border-radius: 0;
            box-shadow: none;
            cursor: pointer;
            overflow: hidden;
            transform: translateZ(0) scale(1);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            will-change: transform;
        }
        .album-square:not(:last-child) {
            margin-right: 32px;
        }

        /* Breathing animations */
        @keyframes breathe-container {
            0% { transform: translateZ(0) scale(1); }
            30% { transform: translateZ(0) scale(1.015); }
            70% { transform: translateZ(0) scale(1.008); }
            100% { transform: translateZ(0) scale(1); }
        }
        @keyframes breathe-image {
            0% { transform: translateY(0px) scale(1); }
            30% { transform: translateY(-4px) scale(1.015); }
            70% { transform: translateY(-2px) scale(1.008); }
            100% { transform: translateY(0px) scale(1); }
        }
        .album-square:hover { animation: breathe-container 6s ease-in-out infinite; }

        .album-square .cover-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
            will-change: opacity, transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .album-square:hover .cover-pixelated { animation: breathe-image 6s ease-in-out infinite; }
        .album-square:hover .cover-sharp { animation: breathe-image 6s ease-in-out infinite; }
        .album-square:not(:hover) .cover-pixelated,
        .album-square:not(:hover) .cover-sharp {
            animation: none;
            transform: translateY(0px) scale(1);
        }
        .album-square:not(:hover) { animation: none; transform: translateZ(0) scale(1); }

        .album-square .cover-pixelated {
            z-index: 2;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            opacity: 1;
        }
        .album-square .cover-sharp {
            z-index: 1;
            opacity: 0;
        }
        .album-square:not(.animating) .cover-sharp { opacity: 0; }
        .album-square:not(.animating):hover .cover-pixelated { opacity: 0; }
        .album-square:not(.animating):hover .cover-sharp { opacity: 1; }
        .album-square.animated-cover .cover-sharp { display: none; }
        .album-square.animated-cover .cover-pixelated {
            opacity: 1 !important;
            transition: none;
        }

        /* --- responsive spacing tweaks (desktop) --- */
        @media (max-width: 900px) {
            .album-square:not(:last-child) { margin-right: 26px; }
        }
        @media (max-width: 700px) {
            .album-square:not(:last-child) { margin-right: 22px; }
        }

        /* --- MOBILE FIX: no layout changes, just ensure wheel isn't cut off --- */
        @media (max-width: 640px) {
            .wheel-container {
                /* The 100dvh + safe-area padding already fixes the cutoff */
                padding: 12px 0;
                padding-bottom: max(12px, env(safe-area-inset-bottom, 16px));
            }
            .scroll-wrapper {
                padding: 0.25rem 0.1rem;
            }
            .album-square:not(:last-child) {
                margin-right: 14px;
            }
        }

        @media (max-width: 480px) {
            .album-square:not(:last-child) {
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="header-section">
            <img src="assets/releases.png" alt="Friends With Bears Records - Releases" class="title-image" id="titleImage">
            <img src="assets/arrow.png" alt="Navigate releases" class="arrow-image" id="arrowImage">
        </div>
        <div class="scroll-wrapper" id="scrollWheel">
            <div class="wheel-track" id="wheelTrack"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const RELEASES = [
                { src: 'assets/fridae-cover.jpg', artist: 'April Fridae', title: 'Fridae', url: 'https://friendswithbears.com/releases/fridae' },
                { src: 'assets/eliesriot_dying_to_live.jpg', artist: 'eliesriot', title: 'Dying to Live', url: 'https://friendswithbears.com/releases/dying-to-live' },
                { src: 'assets/creaturethief_ct-24.jpg', artist: 'creaturethief', title: 'CT-24', url: 'https://friendswithbears.com/releases/ct-24' },
                { src: 'assets/zayok_in_elsewhere.jpg', artist: 'Zayok', title: 'In elsewhere', url: 'https://friendswithbears.com/releases/in-elsewhere' },
                { src: 'assets/creaturethief_verdant.jpg', artist: 'creaturethief', title: 'verdant', url: 'https://friendswithbears.com/releases/verdant' }
            ];

            const FALLBACKS = ['#b5838d', '#6d597a', '#2a9d8f', '#e76f51', '#264653'];
            const COPIES = 5;

            const ANIMATIONS = {
                'assets/fridae-cover.jpg': {
                    frames: [
                        'assets/animation/fridae-cover-1.jpg',
                        'assets/animation/fridae-cover-2.jpg'
                    ],
                    frameDelay: 20
                },
                'assets/eliesriot_dying_to_live.jpg': {
                    frames: [
                        'assets/animation/eliesriot_dying_to_live-1.jpg',
                        'assets/animation/eliesriot_dying_to_live-2.jpg'
                    ],
                    frameDelay: 20
                },
                'assets/creaturethief_ct-24.jpg': {
                    frames: [
                        'assets/animation/creaturethief_ct-24-1.jpg',
                        'assets/animation/creaturethief_ct-24-2.jpg'
                    ],
                    frameDelay: 20
                },
                'assets/zayok_in_elsewhere.jpg': {
                    frames: [
                        'assets/animation/zayok_in_elsewhere-1.jpg',
                        'assets/animation/zayok_in_elsewhere-2.jpg'
                    ],
                    frameDelay: 20
                },
                'assets/creaturethief_verdant.jpg': {
                    frames: [
                        'assets/animation/creaturethief_verdant-1.jpg',
                        'assets/animation/creaturethief_verdant-2.jpg'
                    ],
                    frameDelay: 20
                }
            };

            const wrapper = document.getElementById('scrollWheel');
            const track = document.getElementById('wheelTrack');
            const titleImage = document.getElementById('titleImage');
            const arrowImage = document.getElementById('arrowImage');
            if (!wrapper || !track || !titleImage || !arrowImage) return;

            // ----- Sizing: cover size based on viewport height -----
            function getSize() {
                const vh = window.innerHeight;
                let s = Math.min(vh * 0.45, 500);
                s = Math.max(s, 100);
                return s;
            }

            function getSpacing() {
                const w = window.innerWidth;
                if (w < 480) return 14;
                if (w < 700) return 20;
                if (w < 900) return 26;
                return 32;
            }

            function updateTitleSize(currentSize) {
                const titleHeight = Math.min(currentSize * 0.2, 80);
                titleImage.style.height = titleHeight + 'px';
                titleImage.style.width = 'auto';
                const arrowHeight = titleHeight * 0.7;
                arrowImage.style.height = arrowHeight + 'px';
                arrowImage.style.width = 'auto';
            }

            let currentSize = getSize();

            function buildTrack() {
                const size = getSize();
                const gap = getSpacing();

                track.innerHTML = '';
                const total = RELEASES.length * COPIES;

                for (let i = 0; i < total; i++) {
                    const idx = i % RELEASES.length;
                    const release = RELEASES[idx];
                    const isAnimated = ANIMATIONS.hasOwnProperty(release.src);

                    const container = document.createElement('div');
                    container.className = 'album-square';
                    container.style.width = size + 'px';
                    container.style.height = size + 'px';
                    container.dataset.src = release.src;
                    container.dataset.artist = release.artist;
                    container.dataset.title = release.title;
                    container.dataset.url = release.url;

                    const sharp = document.createElement('div');
                    sharp.className = 'cover-layer cover-sharp';
                    sharp.style.backgroundImage = `url('${release.src}')`;
                    sharp.style.backgroundColor = FALLBACKS[idx];

                    const pixelated = document.createElement('div');
                    pixelated.className = 'cover-layer cover-pixelated';
                    pixelated.style.backgroundColor = FALLBACKS[idx];
                    pixelated.style.imageRendering = 'pixelated';
                    pixelated.style.imageRendering = '-moz-crisp-edges';
                    pixelated.style.imageRendering = 'crisp-edges';

                    if (isAnimated) {
                        container.classList.add('animated-cover');
                        const animData = ANIMATIONS[release.src];
                        pixelated.style.backgroundImage = `url('${release.src}')`;

                        animData.frames.forEach(frame => {
                            const img = new Image();
                            img.src = frame;
                        });

                        container._animData = animData;
                        container._currentFrameIndex = 0;
                        container._animInterval = null;
                        container._pixelatedLayer = pixelated;

                        container.addEventListener('mouseenter', function(e) {
                            if (this._animInterval) {
                                clearInterval(this._animInterval);
                                this._animInterval = null;
                            }
                            const data = this._animData;
                            const frames = data.frames;
                            this._currentFrameIndex = 0;
                            this._pixelatedLayer.style.backgroundImage = `url('${frames[0]}')`;
                            this._animInterval = setInterval(() => {
                                const nextIndex = this._currentFrameIndex + 1;
                                if (nextIndex < frames.length) {
                                    this._currentFrameIndex = nextIndex;
                                    this._pixelatedLayer.style.backgroundImage = `url('${frames[nextIndex]}')`;
                                } else {
                                    clearInterval(this._animInterval);
                                    this._animInterval = null;
                                }
                            }, data.frameDelay);
                        });

                        container.addEventListener('mouseleave', function(e) {
                            if (this._animInterval) {
                                clearInterval(this._animInterval);
                                this._animInterval = null;
                            }
                            if (this._currentFrameIndex <= 0) {
                                this._pixelatedLayer.style.backgroundImage = `url('${this.dataset.src}')`;
                                return;
                            }
                            const data = this._animData;
                            const frames = data.frames;
                            this._animInterval = setInterval(() => {
                                const nextIndex = this._currentFrameIndex - 1;
                                if (nextIndex >= 0) {
                                    this._currentFrameIndex = nextIndex;
                                    this._pixelatedLayer.style.backgroundImage = `url('${frames[nextIndex]}')`;
                                } else {
                                    clearInterval(this._animInterval);
                                    this._animInterval = null;
                                    this._pixelatedLayer.style.backgroundImage = `url('${this.dataset.src}')`;
                                }
                            }, data.frameDelay);
                        });

                    } else {
                        const pixelatedSrc = release.src.replace(/\.(jpe?g|png|webp)$/i, '-pixelated.$1');
                        pixelated.style.backgroundImage = `url('${pixelatedSrc}')`;
                        const imgTest = new Image();
                        imgTest.onerror = function() {
                            pixelated.style.backgroundImage = `url('${release.src}')`;
                        };
                        imgTest.src = pixelatedSrc;
                    }

                    container.appendChild(sharp);
                    container.appendChild(pixelated);

                    container.addEventListener('click', function() {
                        window.location.href = this.dataset.url;
                    });

                    track.appendChild(container);
                }

                const squares = track.querySelectorAll('.album-square');
                squares.forEach((el, i) => {
                    if (i < squares.length - 1) el.style.marginRight = gap + 'px';
                });

                updateTitleSize(size);
                currentSize = size;

                const itemWidth = size + gap;
                const midCopy = Math.floor(COPIES / 2);
                wrapper.scrollLeft = midCopy * RELEASES.length * itemWidth;

                return { size, gap, itemWidth };
            }

            let itemWidth = 0;
            let oneSetWidth = 0;

            function init() {
                const result = buildTrack();
                itemWidth = result.itemWidth;
                const size = result.size;
                const gap = result.gap;
                oneSetWidth = RELEASES.length * itemWidth;

                let loopScheduled = false;

                function performLoopJump() {
                    if (loopScheduled) return;
                    loopScheduled = true;
                    requestAnimationFrame(() => {
                        loopScheduled = false;
                        const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
                        const current = wrapper.scrollLeft;
                        const threshold = itemWidth * 0.3;
                        if (current > maxScroll - threshold) {
                            wrapper.scrollLeft = current - oneSetWidth;
                            return;
                        }
                        if (current < threshold) {
                            wrapper.scrollLeft = current + oneSetWidth;
                            return;
                        }
                    });
                }

                let scrollStopTimer = null;

                function onScrollStart() {
                    if (scrollStopTimer) {
                        clearTimeout(scrollStopTimer);
                        scrollStopTimer = null;
                    }
                }

                function onScrollEnd() {
                    performLoopJump();
                }

                if ('onscrollend' in window) {
                    wrapper.addEventListener('scrollend', onScrollEnd, { passive: true });
                    wrapper.addEventListener('scroll', onScrollStart, { passive: true });
                } else {
                    wrapper.addEventListener('scroll', () => {
                        if (scrollStopTimer) clearTimeout(scrollStopTimer);
                        scrollStopTimer = setTimeout(() => {
                            scrollStopTimer = null;
                            onScrollEnd();
                        }, 150);
                    }, { passive: true });
                }

                const SENSITIVITY = 0.5;

                window.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const dx = e.deltaX || 0;
                    const dy = e.deltaY || 0;
                    const raw = Math.abs(dx) > Math.abs(dy) ? dx : dy;
                    wrapper.scrollLeft += raw * SENSITIVITY;
                }, { passive: false });

                let touchStartX = 0,
                    touchStartY = 0,
                    touchStartScroll = 0,
                    touching = false;

                window.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                        touchStartScroll = wrapper.scrollLeft;
                        touching = true;
                    }
                }, { passive: true });

                window.addEventListener('touchmove', (e) => {
                    if (!touching || e.touches.length !== 1) return;
                    e.preventDefault();
                    const tx = e.touches[0].clientX;
                    const ty = e.touches[0].clientY;
                    const dx = touchStartX - tx;
                    const dy = touchStartY - ty;
                    let raw = dx;
                    if (Math.abs(dy) > Math.abs(dx) * 0.5) {
                        raw = dy;
                    }
                    wrapper.scrollLeft = touchStartScroll + raw * SENSITIVITY;
                }, { passive: false });

                window.addEventListener('touchend', () => {
                    touching = false;
                    setTimeout(onScrollEnd, 100);
                }, { passive: true });

                window.addEventListener('touchcancel', () => {
                    touching = false;
                    setTimeout(onScrollEnd, 100);
                }, { passive: true });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        const step = size * 0.6;
                        wrapper.scrollLeft += e.key === 'ArrowLeft' ? -step : step;
                        setTimeout(onScrollEnd, 50);
                    }
                });

                let resizeTimer = null;

                function onResize() {
                    if (resizeTimer) {
                        cancelAnimationFrame(resizeTimer);
                        resizeTimer = null;
                    }
                    resizeTimer = requestAnimationFrame(() => {
                        resizeTimer = null;
                        const newSize = getSize();
                        const newGap = getSpacing();
                        if (Math.abs(newSize - currentSize) < 3 && newGap === gap) return;
                        const result = buildTrack();
                        itemWidth = result.itemWidth;
                        oneSetWidth = RELEASES.length * itemWidth;
                        const ratio = wrapper.scrollLeft / (itemWidth || 1);
                        wrapper.scrollLeft = ratio * itemWidth;
                        setTimeout(onScrollEnd, 100);
                    });
                }

                window.addEventListener('resize', onResize);
                setTimeout(onScrollEnd, 200);
            }

            init();
        })();
    </script>

</body>
</html>
