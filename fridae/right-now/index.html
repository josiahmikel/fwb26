<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>April Fridae - right now</title>
    <meta name="description" content="April Fridae's new single 'right now' - Listen everywhere">
    <link rel="canonical" href="https://friendswithbears.com/fridae/right-now/">
    <meta property="og:title" content="April Fridae - right now">
    <meta property="og:description" content="Listen to April Fridae's new single 'right now'">
    <meta property="og:url" content="https://friendswithbears.com/fridae/right-now/">
    <meta property="og:image" content="https://friendswithbears.com/assets/covers/fridae-cover.jpg">
    <meta name="twitter:title" content="April Fridae - right now">
    <meta name="twitter:description" content="Listen to April Fridae's new single 'right now'">
    <meta name="twitter:image" content="https://friendswithbears.com/assets/covers/fridae-cover.jpg">

    <!-- ===== SHARED STYLES ===== -->
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">

    <!-- Page-specific styles -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 100vh;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            padding: 80px 20px 0 20px;
            align-items: center;
        }

        .container {
            max-width: 360px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .title-text {
            font-family: 'CustomHeader', 'Helvetica', 'Arial', sans-serif;
            font-size: 3.5rem;
            color: #292929;
            line-height: 1.2;
            letter-spacing: 0.02em;
            text-transform: lowercase;
            margin: 0 0 50px 0;
            width: 100%;
            text-align: center;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .listen-link {
            display: inline-block;
            font-size: 0.9rem;
            color: #292929;
            text-decoration: underline;
            text-underline-offset: 0.2em;
            text-decoration-thickness: 1px;
            text-decoration-color: #292929;
            transition: color 0.3s ease, text-decoration-color 0.3s ease;
            cursor: pointer;
            margin: 20px 0 50px 0;
        }

        .listen-link:hover {
            animation: rainbowLink 1.5s linear infinite;
        }

        .lyrics-image {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 40px;
        }

        .zine {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }

        .zine-link {
            display: inline-block;
            font-size: 0.9rem;
            color: #292929;
            text-decoration: underline;
            text-underline-offset: 0.2em;
            text-decoration-thickness: 1px;
            text-decoration-color: #292929;
            transition: color 0.3s ease, text-decoration-color 0.3s ease;
            cursor: pointer;
            margin-bottom: 1.8rem;
        }

        .zine-link:hover {
            animation: rainbowLink 1.5s linear infinite;
        }

        .zine img {
            width: 100%;
            display: block;
            margin-bottom: 0;
        }

        /* ===== RAINBOW LINK ANIMATION ===== */
        @keyframes rainbowLink {
            0% { color: #ff0040; text-decoration-color: #ff0040; }
            16% { color: #ff4400; text-decoration-color: #ff4400; }
            33% { color: #ffdd00; text-decoration-color: #ffdd00; }
            50% { color: #00ff44; text-decoration-color: #00ff44; }
            66% { color: #00ddff; text-decoration-color: #00ddff; }
            83% { color: #cc00ff; text-decoration-color: #cc00ff; }
            100% { color: #ff0040; text-decoration-color: #ff0040; }
        }

        /* Apply to all links on the page */
        a {
            color: #292929;
            text-decoration: underline;
            text-underline-offset: 0.2em;
            text-decoration-thickness: 1px;
            text-decoration-color: #292929;
            transition: color 0.3s ease, text-decoration-color 0.3s ease;
        }

        a:hover {
            animation: rainbowLink 1.5s linear infinite;
        }

        /* Footer - centered copyright only */
        .page-footer {
            flex-shrink: 0;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 0.5rem 0 0.75rem 0;
            font-size: 0.75rem;
            color: #999999;
            text-align: center;
            background: transparent;
            line-height: 1.8;
        }

        .page-footer a {
            color: #999999;
            text-decoration: none;
            text-decoration-color: #999999;
        }

        .page-footer a:hover {
            animation: rainbowLink 1.5s linear infinite;
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .page-wrapper {
                padding: 50px 15px 0 15px;
            }
            .title-text {
                font-size: 2.6rem;
                margin: 0 0 40px 0;
            }
            .video-container {
                border-radius: 8px;
            }
            .listen-link {
                font-size: 0.85rem;
                margin: 16px 0 40px 0;
            }
            .zine-link {
                font-size: 0.85rem;
                margin-bottom: 1.5rem;
            }
            .zine {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <span class="title-text">right now</span>

            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/x0PycFYuwkk?si=NnFUZhZui7E82PzR" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>

            <a class="listen-link" href="https://too.fm/eo9oxo0" target="_blank" rel="noopener noreferrer">Listen everywhere</a>

            <img src="/assets/img/april-fridae_right-now_lyrics.jpg" alt="Lyrics" class="lyrics-image" />

            <section class="zine">
                <a class="zine-link" href="/mailing-list/" rel="noopener noreferrer">Get a free zine</a>
                <a href="/mailing-list/" rel="noopener noreferrer">
                    <img src="/assets/img/april-fridae_right-now_zine.jpg" alt="Get a free April Fridae zine" loading="lazy">
                </a>
            </section>
        </div>

        <!-- ===== FOOTER - centered copyright only ===== -->
        <div class="page-footer">
            ©2026 <a href="/">Friends With Bears Records</a>
        </div>
    </div>
</body>
</html>
