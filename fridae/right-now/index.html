<head>

    <!-- Page-specific styles -->
    <style>
        body {
            background: white;
            padding: 80px 20px 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 360px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-text {
            font-size: 3.5rem;
            margin: 0 auto 50px auto;
            width: 100%;
            text-align: center;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .listen-link,
        .zine-link {
            display: inline-block;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .15em;
            color: #292929;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color .15s ease;
            cursor: pointer;
        }

        .listen-link:hover,
        .zine-link:hover {
            border-bottom-color: #292929;
        }

        .listen-link {
            margin: 20px 0 50px 0;
        }

        .lyrics-image {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 40px;
        }

        .zine {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }

        .zine-link {
            margin-bottom: 1.8rem;
        }

        .zine img {
            width: 100%;
            display: block;
            margin-bottom: 0;
        }

        .page-footer {
            width: 100%;
            max-width: 360px;
            padding: 0.6rem 0 0.3rem 0;
            margin: 0 auto;
        }

        @media (max-width: 640px) {
            body {
                padding: 50px 15px 30px 15px;
            }
            .title-text {
                font-size: 2.6rem;
                margin: 0 auto 40px auto;
            }
            .video-container {
                border-radius: 8px;
            }
            .listen-link,
            .zine-link {
                font-size: .65rem;
            }
            .listen-link {
                margin: 16px 0 40px 0;
            }
            .zine-link {
                margin-bottom: 1.5rem;
            }
            .zine {
                margin-bottom: 30px;
            }
        }

</head>

    <div class="container">

        <div class="page-footer">
