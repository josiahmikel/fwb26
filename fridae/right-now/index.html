<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APRIL FRIDAE - RIGHT NOW - OUT NOW</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: white;
            font-family: 'Helvetica', 'Arial', sans-serif;
            padding: 80px 20px 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 360px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-image {
            width: 80%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 50px auto;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* ----- Shared link style – no uppercase now ----- */
        .listen-link,
        .zine-link {
            display: inline-block;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .15em;
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color .15s ease;
            cursor: pointer;
            /* removed text-transform: uppercase; */
        }
        .listen-link:hover,
        .zine-link:hover {
            border-bottom-color: #000;
        }

        .listen-link {
            margin: 20px 0 50px 0;
        }

        .lyrics-image {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 40px;
        }

        .zine {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }
        .zine-link {
            margin-bottom: 1.8rem;
            color: #000;
        }
        .zine a:last-child {
            display: block;
        }
        .zine img {
            width: 100%;
            display: block;
            margin-bottom: 0;
        }

        .footer {
            width: 100%;
            max-width: 360px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.6rem;
            color: #999;
            text-align: center;
            padding: 0.6rem 0 0.3rem 0;
            margin: 0 auto;
        }
        .footer a {
            color: #999;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            body {
                padding: 50px 15px 30px 15px;
            }
            .footer {
                font-size: 0.55rem;
                padding: 0.5rem 0 0.2rem 0;
            }
            .video-container {
                border-radius: 8px;
            }
            .title-image {
                width: 85%;
            }
            .listen-link,
            .zine-link {
                font-size: .65rem;
            }
            .listen-link {
                margin: 16px 0 40px 0;
            }
            .zine-link {
                margin-bottom: 1.5rem;
            }
            .zine {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="right-now.png" alt="April Fridae - right now" class="title-image" />
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/x0PycFYuwkk?si=NnFUZhZui7E82PzR" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>

        <a class="listen-link" href="https://too.fm/eo9oxo0" target="_blank" rel="noopener noreferrer">Listen everywhere</a>

        <img src="lyrics-v2.jpg" alt="Lyrics" class="lyrics-image" />

        <section class="zine">
            <a class="zine-link" href="https://forms.gle/mTULuhfHLPMHjNoW8" target="_blank" rel="noopener noreferrer">Get a free zine</a>
            <a href="https://forms.gle/mTULuhfHLPMHjNoW8" target="_blank" rel="noopener noreferrer">
                <img src="zine.jpg" alt="Get a free April Fridae zine" loading="lazy">
            </a>
        </section>

        <div class="footer">
            <a href="https://friendswithbears.com" target="_blank" rel="noopener noreferrer">©2026 Friends With Bears Records</a>
        </div>
    </div>
</body>
</html>
