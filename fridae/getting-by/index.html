    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 100vh;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            padding: 80px 20px 0 20px;
            align-items: center;
        }

        .container {
            max-width: 360px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .title-text {
            font-family: 'CustomHeader', 'Helvetica', 'Arial', sans-serif;
            font-size: 2.8rem;
            color: #292929;
            line-height: 1.2;
            letter-spacing: 0.02em;
            text-transform: lowercase;
            margin: 0 0 50px 0;
            width: 100%;
            text-align: center;
            word-break: break-word;
            text-decoration: none !important;
            cursor: pointer;
        }

        .title-text:hover {
            color: #292929 !important;
            text-decoration: none !important;
            animation: none !important;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* --- Streaming platforms - 3 per row --- */
        .platforms-heading {
            font-size: 0.75rem;
            font-weight: 400;
            color: #666;
            text-align: center;
            margin: 30px 0 20px 0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .platforms {
            width: 100%;
            margin: 0 0 40px 0;
            padding: 0;
            list-style: none;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem 0.5rem;
            justify-items: center;
            align-items: center;
        }

        .platforms li {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .platforms a {
            display: block;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0.85;
            width: 100%;
            max-width: 70px;
        }

        .platforms a:hover {
            transform: scale(1.08);
            opacity: 1;
        }

        .platforms .logo {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .platforms .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* --- zine section --- */
        .zine {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }

        .zine-link {
            display: inline-block;
            font-size: 0.85rem;
            color: #292929;
            text-decoration: underline;
            text-underline-offset: 0.2em;
            text-decoration-thickness: 1px;
            text-decoration-color: #292929;
            transition: color 0.3s ease, text-decoration-color 0.3s ease;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .zine-link:hover {
            animation: rainbowLink 1.5s linear infinite;
        }

        .zine img {
            width: 100%;
            display: block;
            margin-bottom: 0;
        }

        /* --- rainbow animation --- */
        @keyframes rainbowLink {
            0% { color: #ff0040; text-decoration-color: #ff0040; }
            16% { color: #ff4400; text-decoration-color: #ff4400; }
            33% { color: #ffdd00; text-decoration-color: #ffdd00; }
            50% { color: #00ff44; text-decoration-color: #00ff44; }
            66% { color: #00ddff; text-decoration-color: #00ddff; }
            83% { color: #cc00ff; text-decoration-color: #cc00ff; }
            100% { color: #ff0040; text-decoration-color: #ff0040; }
        }

        /* Override rainbow for title */
        .title-text:hover {
            animation: none !important;
            color: #292929 !important;
            text-decoration: none !important;
        }

        .page-footer {
            flex-shrink: 0;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 0.5rem 0 0.75rem 0;
            font-size: 0.7rem;
            color: #999999;
            text-align: center;
            background: transparent;
            line-height: 1.8;
        }

        .page-footer a {
            color: #999999;
            text-decoration: none;
            text-decoration-color: #999999;
        }

        .page-footer a:hover {
            animation: rainbowLink 1.5s linear infinite;
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .page-wrapper {
                padding: 40px 12px 0 12px;
            }
            .container {
                max-width: 320px;
            }
            .title-text {
                font-size: 2.2rem;
                margin: 0 0 35px 0;
            }
            .video-container {
                border-radius: 8px;
            }
            .platforms-heading {
                font-size: 0.65rem;
                margin: 20px 0 15px 0;
            }
            .platforms {
                gap: 0.5rem 0.35rem;
                margin-bottom: 30px;
            }
            .platforms a {
                max-width: 55px;
            }
            .zine-link {
                font-size: 0.75rem;
                margin-bottom: 1.2rem;
            }
            .zine {
                margin-bottom: 30px;
            }
            .page-footer {
                font-size: 0.6rem;
            }
        }

        @media (max-width: 400px) {
            .container {
                max-width: 280px;
            }
            .title-text {
                font-size: 1.8rem;
            }
            .platforms a {
                max-width: 45px;
            }
            .platforms {
                gap: 0.4rem 0.25rem;
            }
        }
    </style>
</head>
